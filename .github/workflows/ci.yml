name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: mobile_app/pubspec.yaml
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite with Coverage
        run: flutter test --coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: mobile_app/coverage/lcov.info
          if-no-files-found: ignore

      - name: Verify Minimum Line Coverage
        run: dart run tool/check_coverage.dart

  build:
    name: Build (${{ matrix.target }})
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        target: [web, android]

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            mobile_app/android/build.gradle.kts
            mobile_app/android/app/build.gradle.kts
            mobile_app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: mobile_app/pubspec.yaml
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        if: matrix.target == 'web'
        run: flutter build web --release --dart-define=MOCK_API=true

      - name: Upload Web Build Artifact
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: mobile_app/build/web
          if-no-files-found: error

      - name: Build Android Debug APK
        if: matrix.target == 'android'
        run: flutter build apk --debug
